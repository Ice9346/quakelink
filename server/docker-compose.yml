services:
  db:
    image: postgres:16
    container_name: quakelink_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: quakelink
    ports:
      - "5432:5432"
    volumes:
      - quakelink_pgdata:/var/lib/postgresql/data

volumes:
  quakelink_pgdata:
